services:
  postgres:
    image: postgres:16-alpine
    container_name: byggeplads-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: safety_admin
      POSTGRES_PASSWORD: safety_dev_password_2026
      POSTGRES_DB: byggeplads_safety
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safety_admin -d byggeplads_safety"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
