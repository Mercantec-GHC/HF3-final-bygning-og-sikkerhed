<!doctype html>
<html lang="da">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#167c45">
    <meta name="description" content="Byggeplads Safety alarmstatus">
    <title>Byggeplads Safety</title>
    <style>
        :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #fff; background: #167c45; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; min-height: 100svh; background: inherit; }
        main { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 2rem 1.25rem; text-align: center; transition: background-color .2s ease; }
        .card { width: min(100%, 30rem); }
        .status-icon { font-size: clamp(4rem, 18vw, 8rem); line-height: 1; margin-bottom: 1rem; }
        h1 { font-size: clamp(2.2rem, 10vw, 4rem); margin: 0 0 .75rem; }
        p { font-size: 1.1rem; margin: .5rem 0; }
        .details { min-height: 3.5rem; opacity: .9; }
        button { border: 0; border-radius: .75rem; background: #fff; color: #9c1c26; cursor: pointer; font: inherit; font-size: 1.2rem; font-weight: 700; margin-top: 1.5rem; min-height: 3.5rem; padding: .75rem 2rem; width: 100%; }
        button:focus-visible { outline: 4px solid #ffd166; outline-offset: 3px; }
        button[hidden] { display: none; }
        .connection { font-size: .85rem; margin-top: 1.5rem; opacity: .8; }
        .safe { background: #167c45; }
        .alarm { background: #b51f2a; }
    </style>
</head>
<body>
    <main id="status-screen" class="safe" aria-live="assertive">
        <section class="card" aria-labelledby="status-title">
            <div id="status-icon" class="status-icon" aria-hidden="true">✓</div>
            <h1 id="status-title">Alt er sikkert</h1>
            <p id="status-message">Ingen aktive alarmer</p>
            <p id="alarm-details" class="details"></p>
            <button id="acknowledge-button" type="button" hidden>Forstået</button>
            <p id="connection-status" class="connection">Forbinder…</p>
        </section>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js" crossorigin="anonymous"></script>
    <script src="/js/app.js"></script>
</body>
</html>
